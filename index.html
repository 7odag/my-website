<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphy - بيع هوديز</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            text-align: center;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px 0;
        }
        .product {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .product img {
            width: 200px;
            height: auto;
        }
        .price {
            font-size: 24px;
            color: #e74c3c;
            margin-top: 15px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>مرحبا في Graphy</h1>
        <p>متجر بيع الهوديز بأفضل الأسعار</p>
    </header>
    <div class="container">
        <div class="product">
            <h2>هودي مميز</h2>
            <img src="https://example.com/hoodie.jpg" alt="هودي">
            <p>هودي من القطن الناعم يناسب جميع الأوقات</p>
            <div class="price">500 جنيه</div>
            <a href="https://example.com/purchase" class="btn">اشتر الآن</a>
        </div>
    </div>
</body>
</html>
